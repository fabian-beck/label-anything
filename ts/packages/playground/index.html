<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Label Anything Playground</title>
<meta name="description" content="Try the Label Anything engine live in the browser: maps, networks, charts, moving objects and pictures, with every labeling option in reach.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='3' y='9' width='20' height='11' rx='2' fill='%233949ab'/%3E%3Cpath d='M23 20l5 6' stroke='%233949ab' stroke-width='2.5' stroke-linecap='round'/%3E%3Ccircle cx='28' cy='26' r='2.5' fill='%233949ab'/%3E%3C/svg%3E">
<link rel="stylesheet" href="style.css">
<script type="module" src="app.js"></script>
</head>
<body>
<header class="top">
  <a class="brand" href="../" title="Label Anything documentation">
    <svg viewBox="0 0 32 32" aria-hidden="true"><rect x="3" y="9" width="20" height="11" rx="2"/><path d="M23 20l5 6"/><circle cx="28" cy="26" r="2.5"/></svg>
    <span>Label Anything</span>
  </a>
  <span class="product">Playground</span>
  <nav class="scenes" id="scenes" aria-label="Scenes"></nav>
  <div class="top-end">
    <label class="engine" title="Which implementation solves: the Rust core compiled to WebAssembly, or the TypeScript port. Both give identical layouts.">
      <span class="sr">Engine</span>
      <select id="engine">
        <option value="wasm">WebAssembly</option>
        <option value="ts">TypeScript</option>
      </select>
    </label>
    <a class="toplink" href="explain.html" title="Step through a solve: candidates, the greedy pass, local search">How it works</a>
    <a class="toplink" href="../">Docs</a>
    <a class="toplink" href="https://github.com/fabian-beck/label-anything">GitHub</a>
  </div>
</header>
<main class="app">
  <section class="stage-wrap" id="stage-wrap" aria-label="Drawing">
    <canvas id="stage" tabindex="0" aria-label="Labeled drawing"></canvas>
    <div class="hud hud-tl" id="hud-title"></div>
    <div class="hud hud-tr" id="hud-stats" aria-live="polite"></div>
    <div class="hud hud-legend" id="hud-legend"></div>
    <div class="hud hud-bl" id="hud-transport"></div>
    <div class="hud hud-br" id="hud-view"></div>
    <div class="banner" id="banner" hidden></div>
  </section>
  <aside class="panel" id="panel" aria-label="Options">
    <nav class="tabs" role="tablist">
      <button role="tab" id="tab-options" aria-selected="true" data-tab="options">Options</button>
      <button role="tab" id="tab-inspect" aria-selected="false" data-tab="inspect">Inspect</button>
      <button role="tab" id="tab-code" aria-selected="false" data-tab="code">Code</button>
    </nav>
    <div class="tabpanel" id="panel-options" data-tab="options"></div>
    <div class="tabpanel" id="panel-inspect" data-tab="inspect" hidden></div>
    <div class="tabpanel" id="panel-code" data-tab="code" hidden></div>
    <footer class="credits" id="credits"></footer>
  </aside>
</main>
<noscript><p class="noscript">The playground needs JavaScript (and WebAssembly or a recent browser).</p></noscript>
</body>
</html>
