name: Pages

# Builds the documentation site (mkdocs.yml, docs/) and deploys it to GitHub Pages together
# with the benchmark report (brief §8.4: the report is published with the docs site on
# each release):
#
# * after the CI run of a release tag (v*) succeeded. Its `baselines` job ran the benchmark
#   with every baseline and the performance targets, passed the release gates and uploaded
#   the report (artifact bench-report-baselines); it is published at <site>/benchmark-report/,
#   with the gallery at <site>/benchmark-report/gallery/. The site's links into the
#   repository point to that tag (docs/_hooks/la_docs.py).
# * after a weekly or dispatched CI run of main succeeded: the site of main with that run's
#   report (its `baselines` job runs on schedule and dispatch too).
# * on demand (workflow dispatch): the site of the dispatched ref, with the report of the
#   CI run given as `report_run_id`, else the latest report that has not expired.
#
# One-time setup: repository Settings → Pages → Build and deployment → Source:
# "GitHub Actions".

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      report_run_id:
        description: "ID of a CI run whose benchmark report (bench-report-baselines) to publish"
        required: false
        default: ""

permissions:
  contents: read
  actions: read # the report artifact of the CI run

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       ((github.event.workflow_run.event == 'push' &&
         startsWith(github.event.workflow_run.head_branch, 'v')) ||
        (contains(fromJSON('["schedule", "workflow_dispatch"]'), github.event.workflow_run.event) &&
         github.event.workflow_run.head_branch == 'main')))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: docs/requirements.txt
      - run: pip install -r docs/requirements.txt
      - uses: actions/configure-pages@v5
      - run: mkdocs build --strict --site-dir site
        env:
          LA_DOCS_TAG: ${{ github.event.workflow_run.head_branch }}
      - name: Which benchmark report
        id: report
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.report_run_id }}
        run: |
          # the CI run that triggered this one or the one given, else the latest report
          if [ -z "$RUN_ID" ]; then
            RUN_ID=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=bench-report-baselines&per_page=30" \
              --jq '[.artifacts[] | select(.expired | not)][0].workflow_run.id // empty')
          fi
          echo "report of CI run: ${RUN_ID:-none}"
          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
      - name: The benchmark report and gallery of that CI run
        if: steps.report.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: bench-report-baselines
          path: site/benchmark-report
          run-id: ${{ steps.report.outputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
