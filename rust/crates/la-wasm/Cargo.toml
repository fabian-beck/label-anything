[package]
name = "label-anything-wasm"
description = "WebAssembly binding of Label Anything (label placement): wasm-bindgen exports behind the @label-anything/wasm npm package."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
# shipped on npm as @label-anything/wasm (ts/packages/wasm-adapter), not on crates.io
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[features]
# The default build keeps the package small: raw RGBA rasters (`obstacles.raster.rgba`
# and the `raster` option) always work; encoded images need `decode`.
default = []
# PNG/JPEG/WebP decoding of raster `source`s (the `image` crate).
decode = ["label-anything/decode"]

[dependencies]
# not `workspace = true`: the facade's default features include `std-clock`
# (`std::time::Instant` panics on wasm32-unknown-unknown) and `decode`
label-anything = { path = "../label-anything", version = "0.1.0", default-features = false }
# `la_core::geom::Rect` appears in the `Env` trait but is not re-exported by the facade
la-core = { workspace = true }
serde_json = { workspace = true }
wasm-bindgen = { workspace = true }
js-sys = { workspace = true }
