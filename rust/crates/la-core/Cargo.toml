[package]
name = "label-anything-core"
description = "Label Anything label placement engine core: geometry, cost grids, candidates, priority and solver (no I/O)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
parallel = ["dep:rayon", "la-raster/parallel"]
# PNG/JPEG/WebP decoding of raster backgrounds (raw RGBA always works).
decode = ["la-raster/decode"]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
rayon = { workspace = true, optional = true }
la-expr = { workspace = true }
regex-lite = { workspace = true }
la-text = { workspace = true }
la-raster = { workspace = true, default-features = false }
la-svg = { workspace = true }

[dev-dependencies]
# the sample problems include a PNG raster background
la-raster = { workspace = true, features = ["decode"] }
