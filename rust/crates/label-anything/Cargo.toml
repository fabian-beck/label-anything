[package]
name = "label-anything"
description = "Label Anything: a host-independent label placement engine (labels, icons, leaders; avoids SVG/raster backgrounds; priority-driven omission)."
readme = "README.md"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["std-clock", "decode"]
std-clock = []
decode = ["la-core/decode"]
parallel = ["la-core/parallel"]

[dependencies]
la-core = { workspace = true }
la-render = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
la-core = { workspace = true }
la-svg = { workspace = true }
la-raster = { workspace = true, features = ["decode"] }
resvg = { version = "0.48", default-features = false, features = ["text"] }
