[package]
name = "label-anything-raster"
description = "Label Anything label placement: raster backgrounds (decode, ink/alpha/cost/classmap/saliency)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["decode"]
# PNG, JPEG and WebP decoding through the `image` crate (pure Rust, minimal features).
# Without it, `decode` returns a structured `unsupported` error; raw RGBA still works.
decode = ["dep:image"]

[dependencies]
image = { workspace = true, optional = true, features = ["png", "jpeg", "webp"] }

[dev-dependencies]
serde_json = { workspace = true }
