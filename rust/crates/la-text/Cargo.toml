[package]
name = "label-anything-text"
description = "Label Anything label placement: font metrics, simple and full text shaping, line breaking and wrapping."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = ["bundled-font", "shaping"]
bundled-font = []
shaping = ["dep:rustybuzz"]
woff2 = ["dep:wuff"]

[dependencies]
rustybuzz = { workspace = true, optional = true }
wuff = { version = "0.2.9", optional = true, default-features = false, features = ["brotli"] }

[dev-dependencies]
serde_json = { workspace = true, features = ["float_roundtrip"] }
