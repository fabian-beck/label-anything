[package]
name = "label-anything-capi"
description = "C ABI of Label Anything (label placement): JSON in, JSON out, plus raster pixels by pointer (no PNG or base64 encoding)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
name = "labelanything"
crate-type = ["cdylib", "staticlib", "rlib"]

[features]
default = []
# JNI entry points for the Java binding (bindings/java), written against the raw JNIEnv
# function table: the feature adds no dependencies.
jni = []

[dependencies]
label-anything = { workspace = true }
serde_json = { workspace = true }
