[package]
name = "label-anything-cli"
description = "Command-line interface of Label Anything (label placement): place, render, validate, bench, serve."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[[bin]]
name = "label-anything"
path = "src/main.rs"

[features]
default = ["png"]
# `render -o overlay.png`: rasterize the debug SVG (resvg, bundled Noto Sans)
png = ["dep:resvg"]

[dependencies]
label-anything = { workspace = true }
serde_json = { workspace = true }
clap = { version = "4.5", features = ["derive"] }
tiny_http = "0.12"
resvg = { version = "0.48", default-features = false, features = ["text"], optional = true }
