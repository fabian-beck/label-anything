[package]
name = "label-anything-svg"
description = "Label Anything label placement: SVG backgrounds to classified obstacle geometry."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
# Derive `serde::Serialize` for the public data types (JSON shape identical to the
# objects returned by the TypeScript package `@label-anything/svg`).
serde = ["dep:serde"]

[dependencies]
serde = { workspace = true, optional = true }

[[example]]
name = "dump"
required-features = ["serde"]

[dev-dependencies]
serde_json = { workspace = true }
# Oracle for differential tests of our own XML parser (see ADR obstacles/svg); not a runtime dependency.
roxmltree = { workspace = true }
