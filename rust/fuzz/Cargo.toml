# Coverage-guided fuzzing with cargo-fuzz (nightly): see README.md.
[package]
name = "label-anything-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "MIT"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
serde_json = "1.0"
label-anything = { path = "../crates/label-anything" }
la-svg = { package = "label-anything-svg", path = "../crates/la-svg" }
la-raster = { package = "label-anything-raster", path = "../crates/la-raster", features = ["decode"] }

# not part of the main workspace (needs nightly and libFuzzer)
[workspace]
members = ["."]

[[bin]]
name = "place_json"
path = "fuzz_targets/place_json.rs"
test = false
doc = false
bench = false

[[bin]]
name = "svg_parse"
path = "fuzz_targets/svg_parse.rs"
test = false
doc = false
bench = false

[[bin]]
name = "raster_decode"
path = "fuzz_targets/raster_decode.rs"
test = false
doc = false
bench = false
